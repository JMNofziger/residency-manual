<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Residency runbook — Croatia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Sora:wght@400;550;650;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="loading-state" class="loading">Loading…</div>

    <div id="app-shell" hidden>
      <header class="topbar">
        <div class="brand">
          <h1 id="app-title">Employer hiring runbook</h1>
          <p id="app-subtitle">Croatia: labor market test → stay-and-work permit</p>
        </div>
        <div class="top-actions">
          <span class="nationality-chip" id="nationality-chip"></span>
          <div class="seg" role="group" aria-label="Language">
            <button type="button" id="btn-lang-en" class="is-active">EN</button>
            <button type="button" id="btn-lang-hr">HR</button>
          </div>
          <button type="button" class="btn ghost" id="btn-glossary">Glossary</button>
          <button type="button" class="btn ghost" id="btn-offices">Offices</button>
          <button type="button" class="btn ghost" id="btn-theme">Light</button>
          <button type="button" class="btn ghost" id="btn-export">Export case</button>
          <label class="btn ghost file-btn" id="btn-import-label">
            Import case
            <input type="file" id="btn-import" accept="application/json,.json" hidden />
          </label>
          <button type="button" class="btn ghost" id="btn-reset">Reset progress</button>
        </div>
      </header>
      <p class="export-hint muted" id="export-hint"></p>

      <div class="layout">
        <div class="mobile-bar">
          <button type="button" class="btn ghost" id="btn-mobile-nav">Steps</button>
          <span id="mobile-progress" class="muted"></span>
        </div>
        <aside class="sidebar" id="sidebar">
          <h2 id="nav-heading">Steps</h2>
          <nav class="step-nav" id="step-nav" aria-label="Wizard steps"></nav>
        </aside>
        <main class="main-panel" id="main-panel"></main>
      </div>

      <footer class="site-footer">
        <p id="footer-disclaimer"></p>
        <p class="footer-links">
          <a href="#" id="footer-glossary">Glossary</a>
          ·
          <a href="#" id="footer-offices">Offices</a>
          ·
          <a id="footer-sources-link" href="croatia-foreign-worker-sources.md">Source registry</a>
        </p>
      </footer>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
